# LegacyLift default configuration.
# A project-specific version of this file is generated by `legacylift ingest`
# from a MIGRATION_NOTES.md style document, merging its constraints on top
# of these defaults.

scan:
  extensions: [".php", ".inc", ".phtml"]
  max_file_size_kb: 5000
  follow_symlinks: false
  exclude_dirs: ["uploads", "vendor", ".git", "node_modules", "out"]

# Risk score formula (documented in docs/ARCHITECTURE.md):
#   file_risk = sum(severity_weight[finding.severity] for finding in file.findings)
#   file_risk_normalized = min(100, file_risk)
#   project_risk = round(100 * (sum(file_risk_normalized) / (files_scanned * 100)) * scale_factor)
# scale_factor pulls the average up so a handful of critical files in a large,
# mostly-clean tree still reads as high risk — tune here, not in code.
risk:
  severity_weight:
    critical: 40
    high: 20
    medium: 8
    low: 3
  scale_factor: 3.2

# Manual-effort heuristic: developer-hours to fix by hand, per finding,
# by severity. This is an honest estimate for the README/report, not a
# scientific measurement — adjustable here.
effort_heuristic:
  hours_per_finding:
    critical: 1.5
    high: 0.75
    medium: 0.35
    low: 0.15
  legacylift_hours_per_finding: 0.02   # review time for an auto-generated patch

constraints:
  target_php_version: "8.2"
  keep_urls_unchanged: true
  do_not_touch_paths: []
  preserve_encoding: "UTF-8"

fixer:
  db_helper_path: "includes/db.php"
  env_loader_path: "includes/env.php"
  csrf_helper_path: "includes/csrf.php"
  escape_helper_path: "includes/escape.php"
